name: 系统镜像构建
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liuqin-image-builder
  cancel-in-progress: false
jobs:
  image:
    # 高权限装配只执行可信 main，不运行外部 PR。
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, X64, liuqin-images]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - name: 准备 Devbox 构建环境
        working-directory: project
        run: devbox install
      - name: 创建并校验本次镜像构建配置
        working-directory: project
        env:
          BASE_CONFIG: ${{ vars.LIUQIN_BUILD_CONFIG }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          configured = os.environ['BASE_CONFIG']
          source = Path(configured) if configured else Path('build/devbox/build.example.json')
          if configured and not source.is_absolute():
              raise SystemExit('LIUQIN_BUILD_CONFIG must be an absolute runner path')
          data = json.loads(source.read_text())
          if not isinstance(data, dict) or not data.get('rootfs_config'):
              raise SystemExit('Use the official-system configuration from docs/BUILD.md')
          temporary = Path(os.environ['RUNNER_TEMP'])
          data['rom_images'] = str(temporary / 'liuqin-rom/images')
          output = temporary / 'liuqin-image-build.json'
          output.write_text(json.dumps(data) + '\n')
          output.chmod(0o600)
          PY
          devbox run -- python3 build/devbox/build.py show-config \
            --config "$RUNNER_TEMP/liuqin-image-build.json" > /dev/null
          sudo -n true
      - name: 获取并校验原厂 ROM
        working-directory: project
        run: |
          devbox run fetch-rom -- --out "$RUNNER_TEMP/liuqin-rom/images" \
            --cache "$RUNNER_TEMP/liuqin-rom/downloads"
      - name: 构建并导出配套 boot 与 rootfs
        working-directory: project
        run: |
          devbox run plan -- --config "$RUNNER_TEMP/liuqin-image-build.json"
          devbox run build -- --config "$RUNNER_TEMP/liuqin-image-build.json" \
            --export-dir "$RUNNER_TEMP/liuqin-system-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@v4
        with:
          name: liuqin-system-${{ github.sha }}
          if-no-files-found: error
          compression-level: 0
          path: ${{ runner.temp }}/liuqin-system-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7
