name: Windows 安装器检查
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 安装 uv
        run: python -m pip install uv
      - name: 准备锁定环境与离线 Fastboot 替身
        shell: pwsh
        run: |
          uv sync --locked --project installer
          $fixture = Join-Path $env:RUNNER_TEMP 'offline-fastboot.exe'
          [IO.File]::WriteAllText($fixture, 'OFFLINE TEST FIXTURE - NEVER EXECUTED')
          "LIUQIN_FASTBOOT=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: 检查 PowerShell 语法（不修改网卡或防火墙）
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path installer/windows-network.ps1), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | Format-List; exit 1 }
      - name: 主机兼容、备份与 worker 回归
        run: |
          uv run --locked --project installer python tests/windows-installer.py
          uv run --locked --project installer python tests/gui-engine.py
          uv run --locked --project installer python tests/gui-artifacts.py
          uv run --locked --project installer python tests/gui-worker.py
      - name: QML 安装流程（模拟数据）
        run: uv run --locked --project installer python tests/gui-qml.py --screenshots out/windows-preview
      - name: 导出安装器源码
        run: uv run --locked --project installer python installer/package.py --out out/liuqin-linux-kit-installer-windows-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-source-and-preview
          path: |
            out/liuqin-linux-kit-installer-windows-source.zip
            out/windows-preview/
