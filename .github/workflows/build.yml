name: 内核构建
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 安装 Devbox 构建环境
        uses: jetify-com/devbox-install-action@734088efddca47cf44ff8a09289c6d0e51b73218 # v0.12.0
        with:
          devbox-version: 0.18.4
      - name: 创建 CI 构建配置
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('build/devbox/build.example.json').read_text())
          data['jobs'] = 2
          (Path(os.environ['RUNNER_TEMP']) / 'liuqin-build.json').write_text(json.dumps(data) + '\n')
          PY
      - name: 构建默认目标内核与模块
        run: |
          devbox run kernel --config "$RUNNER_TEMP/liuqin-build.json"
          devbox run modules --config "$RUNNER_TEMP/liuqin-build.json"
      - name: 上传内核构建结果
        uses: actions/upload-artifact@v4
        with:
          name: liuqin-kernel-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            out/build/from-source/kernel-*/kernel/arch/arm64/boot/Image
            out/build/from-source/kernel-*/kernel/arch/arm64/boot/dts/qcom/sm8475-xiaomi-liuqin.dtb
            out/build/from-source/kernel-*/kernel/.config
            out/build/from-source/kernel-*/kernel/build-info.json
            out/build/from-source/kernel-*/kernel/SHA256SUMS
            out/build/from-source/kernel-*/kernel/vmlinux
            out/build/from-source/kernel-*/kernel/System.map
            out/build/from-source/modules-*/modules/
          retention-days: 14
