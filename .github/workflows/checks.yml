name: 集成检查
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 与 Shell 语法
        run: |
          python3 - <<'PY'
          import ast
          import subprocess
          from pathlib import Path
          for path in [p for base in ('build','installer','shared','device/boot') for p in Path(base).rglob('*.py')]:
              ast.parse(path.read_text(), filename=str(path))
          paths = [p for name in ('usr/local/libexec', 'usr/libexec')
                   for p in (Path('device/gnome-overlay')/name).iterdir()]
          for path in sorted(paths):
              if path.is_file() and path.read_bytes().split(b'\n', 1)[0] in (b'#!/usr/bin/env python3', b'#!/usr/bin/python3'):
                  ast.parse(path.read_text(), filename=str(path))
          for path in [p for base in ('build','device/installer','device/boot') for p in Path(base).rglob('*.sh')]:
              subprocess.run(['sh', '-n', str(path)], check=True)
          subprocess.run(['sh', '-n', 'device/boot/initramfs/init'], check=True)
          PY
      - name: 构建与安装器离线检查
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-pyelftools gdisk busybox-static device-tree-compiler rpm rsync pigz acl libcap2-bin btrfs-progs
          python3 tests/installer.py
          python3 tests/storage-layouts.py
          python3 tests/gui-engine.py
          python3 tests/gui-artifacts.py
          python3 tests/filesystems.py
          python3 tests/windows-installer.py
          python3 tests/usb-installer-network.py
          python3 tests/custom-kernel.py
          python3 tests/kernel-updates.py
          python3 tests/devbox-build.py
          python3 tests/source-build.py
          python3 tests/stock-rom.py
          python3 tests/fedora-build.py
          python3 tests/nanosic-folio.py
          python3 tests/selinux-packaging.py
          python3 tests/fedora-fingerprint.py
          python3 tests/fingerprint-irq.py
          sudo python3 tests/fingerprint-enrol-preflight.py
          sudo python3 tests/fingerprint-release.py
          python3 tests/shell-defaults.py
          python3 tests/display-clock.py
          python3 tests/display-brightness-minimum.py
          python3 tests/backlight-default.py
          python3 tests/boot-splash.py
          python3 tests/splash-handoff.py
          python3 tests/splash-logo.py
          python3 tests/splash-orientation.py
          python3 tests/plymouth-guard.py
          python3 tests/display-recovery.py
          python3 tests/display-policy.py
          python3 tests/wlan-mac.py
          python3 tests/memory-reclaim.py
          python3 tests/mkbootimg-fetch.py
          python3 tests/initramfs-inputs.py
          python3 tests/sensor-build-environment.py
          python3 tests/project-structure.py
          python3 tests/project-identity.py
          python3 tests/docs-links.py
          python3 tests/gui-worker.py
          python3 tests/installer-layout.py
          sudo python3 tests/rootfs-archive.py
      - name: 根文件系统存储保护
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y busybox-static
          python3 tests/storage-seal.py
          python3 tests/storage-ready.py
          python3 tests/storage-paths.py
          sh tests/persistent-root.sh
      - name: Adreno 传感器读取
        run: |
          sudo apt-get install --no-install-recommends -y g++ pkg-config qt6-base-dev
          python3 tests/adreno-stats.py
      - name: KWin 平板模式回归
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'build/lib')
          from source_build import download
          record = json.loads(Path('device/kwin/source.json').read_text())
          download(record['url'], Path('inputs/kwin') / record['archive'], record['sha256'])
          PY
          python3 tests/kwin-tablet-mode.py
      - name: 设备存储保护
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y busybox-static
          sh tests/storage-guard.sh
      - name: 设备端分区布局
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y busybox-static
          sh tests/install-layout.sh
      - name: 设备端 home 保留
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y busybox-static e2fsprogs
          sh tests/install-root.sh
          python3 tests/install-root-single.py
      - name: 传感器启动策略
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          sudo python3 tests/sensor-startup.py
