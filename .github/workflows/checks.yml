name: 集成检查
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 与 Shell 语法
        run: |
          python3 - <<'PY'
          import ast
          import subprocess
          from pathlib import Path
          for path in [p for base in ('build','installer','shared','device/boot','device/recovery') for p in Path(base).rglob('*.py')]:
              ast.parse(path.read_text(), filename=str(path))
          paths = list(Path('device/board-overlay').rglob('*'))
          for path in sorted(paths):
              if path.is_file() and path.read_bytes().split(b'\n', 1)[0] in (b'#!/usr/bin/env python3', b'#!/usr/bin/python3'):
                  ast.parse(path.read_text(), filename=str(path))
          for path in [p for base in ('build','device/installer','device/boot','device/recovery') for p in Path(base).rglob('*.sh')]:
              subprocess.run(['sh', '-n', str(path)], check=True)
          subprocess.run(['sh', '-n', 'device/boot/initramfs/init'], check=True)
          PY
      - name: 构建与安装器离线检查
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-pyelftools python3-lz4 python3-unicorn gdisk busybox-static device-tree-compiler rpm rsync pigz acl libcap2-bin btrfs-progs f2fs-tools gcc-aarch64-linux-gnu libglib2.0-bin libdrm-dev nodejs
          python3 tests/installer/installer.py
          python3 tests/storage/storage-layouts.py
          python3 tests/boot/multiboot.py
          python3 tests/boot/multiboot-device.py
          python3 tests/boot/multiboot-store.py
          python3 tests/android/android-installer.py
          python3 tests/android/android-device.py
          python3 tests/android/android-direct.py
          python3 tests/android/android-rom.py
          python3 tests/android/miku-rom.py
          python3 tests/android/multi-rom.py
          python3 tests/android/generic-ota.py
          python3 tests/android/full-rom.py
          python3 tests/installer/miku-workflow.py
          python3 tests/android/android-runtime.py
          python3 tests/installer/staged-install.py
          python3 tests/installer/managed-linux-device.py
          python3 tests/storage/partition-discovery.py
          python3 tests/storage/partition-device.py
          python3 tests/storage/partition-editor-device.py
          python3 tests/storage/partition-reread.py
          python3 tests/storage/partition-names.py
          python3 tests/installer/workflow.py
          python3 tests/installer/workflow-capacity.py
          python3 tests/recovery/recovery-installer.py
          python3 tests/recovery/paired-recovery.py
          python3 tests/recovery/recovery-compatibility.py
          python3 tests/recovery/native-recovery.py
          python3 tests/recovery/native-installer.py
          python3 tests/recovery/fixed-recovery-preserve.py
          python3 tests/boot/boot-switch-device.py
          python3 tests/boot/boot-store.py
          python3 tests/boot/boot-retention.py
          python3 tests/installer/transaction-recovery.py
          python3 tests/recovery/native-adb.py
          python3 tests/recovery/native-firmware.py
          python3 tests/recovery/fixed-recovery.py
          python3 tests/recovery/universal-recovery.py
          python3 tests/android/rom-preview.py
          python3 tests/recovery/native-ui-service.py
          python3 tests/recovery/native-bcb.py
          python3 tests/recovery/native-touch-service.py
          python3 tests/recovery/recovery-startup.py
          python3 tests/recovery/recovery-touch-startup.py
          python3 tests/recovery/recovery-usb-session.py
          python3 tests/recovery/recovery-kernel-components.py
          python3 tests/recovery/recovery-source.py
          python3 tests/kernel/kernel-common-fixes.py
          python3 tests/build/rootless-build.py
          cc -Wall -Wextra -Werror -I device/recovery/ui tests/recovery/native-touch-input.c device/recovery/ui/touch_input.c -o /tmp/liuqin-touch-input
          /tmp/liuqin-touch-input
          python3 tests/recovery/recovery-session.py
          python3 tests/recovery/recovery-bootstrap.py
          python3 tests/storage/block-identity.py
          python3 tests/installer/installer-bundled-runtime.py
          python3 tests/installer/gui-engine.py
          python3 tests/installer/gui-artifacts.py
          python3 tests/storage/filesystems.py
          python3 tests/installer/windows-installer.py
          python3 tests/installer/usb-installer-network.py
          python3 tests/build/custom-kernel.py
          python3 tests/boot/kernel-updates.py
          python3 tests/boot/boot-update-store.py
          python3 tests/build/devbox-build.py
