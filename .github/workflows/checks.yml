          python3 tests/input/nanosic-folio.py
          python3 tests/build/selinux-packaging.py
          python3 tests/fingerprint/fedora-fingerprint.py
          python3 tests/fingerprint/fingerprint-irq.py
          sudo python3 tests/fingerprint/fingerprint-native-provider.py
          sudo python3 tests/fingerprint/fingerprint-gallery.py
          python3 tests/fingerprint/fingerprint-gallery-client.py
          sudo python3 tests/fingerprint/fingerprint-enrol-preflight.py
          sudo python3 tests/fingerprint/fingerprint-release.py
          python3 tests/desktop/shell-defaults.py
          python3 tests/display/display-clock.py
          python3 tests/display/display-brightness-minimum.py
          python3 tests/display/display-refresh-rates.py
          python3 tests/display/display-live-refresh.py
          python3 tests/display/backlight-default.py
          python3 tests/power/charger-mode.py
          python3 tests/boot/boot-splash.py
          python3 tests/boot/splash-handoff.py
          python3 tests/boot/splash-logo.py
          python3 tests/boot/splash-orientation.py
          python3 tests/boot/plymouth-guard.py
          python3 tests/display/display-recovery.py
          python3 tests/display/resume-display.py
          python3 tests/display/display-policy.py
          python3 tests/wireless/wlan-mac.py
          python3 tests/power/rtc.py
          python3 tests/desktop/login-ready.py
          python3 tests/power/mipps-startup.py
          python3 tests/power/charge-status.py
          python3 tests/power/mipps-events.py
          python3 tests/storage/storage-scope.py
          python3 tests/build/mkbootimg-fetch.py
          python3 tests/boot/initramfs-inputs.py
          python3 tests/input/sensor-build-environment.py
          python3 tests/build/project-structure.py
          python3 tests/build/docs-links.py
          python3 tests/installer/gui-worker.py
          python3 tests/installer/installer-layout.py
          sudo python3 tests/build/rootfs-archive.py
      - name: 指纹用户态 ABI 与多指识别
        run: |
          sudo apt-get install --no-install-recommends -y meson ninja-build pkg-config gettext libglib2.0-dev libgusb-dev libgudev-1.0-dev libpolkit-gobject-1-dev libdbus-1-dev libsystemd-dev libssl-dev
          sudo python3 tests/fingerprint/fingerprint-abi.py
          aarch64-linux-gnu-gcc -std=c11 -D_GNU_SOURCE -Wall -Wextra -Werror -c device/fingerprint/oem/src/fingerprint/oem/fpc_build_info.c -o "$RUNNER_TEMP/fpc-gallery-client.o"
      - name: 根文件系统存储保护
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y busybox-static
          python3 tests/storage/storage-seal.py
          python3 tests/storage/storage-ready.py
          python3 tests/storage/storage-paths.py
          sh tests/boot/persistent-root.sh
      - name: Adreno 传感器读取
        run: |
          sudo apt-get install --no-install-recommends -y g++ pkg-config qt6-base-dev
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'build/lib')
          from source_build import download
          record = json.loads(Path('build/rootfs/fedora-stats-source.json').read_text())
          download(record['url'], Path('inputs/ksystemstats') / record['archive'], record['sha256'])
          PY
          python3 tests/gpu/adreno-stats.py
      - name: KWin 平板模式回归
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'build/lib')
          from source_build import download
          record = json.loads(Path('device/kwin/source.json').read_text())
          download(record['url'], Path('inputs/kwin') / record['archive'], record['sha256'])
          PY
          python3 tests/desktop/kwin-tablet-mode.py
      - name: 设备存储保护
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y busybox-static
          sh tests/storage/storage-guard.sh
      - name: 设备端分区布局
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y busybox-static
          sh tests/installer/install-layout.sh
      - name: 设备端单根安装
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y busybox-static e2fsprogs
          python3 tests/installer/install-root-single.py
      - name: 传感器启动策略
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          sudo python3 tests/input/sensor-startup.py
