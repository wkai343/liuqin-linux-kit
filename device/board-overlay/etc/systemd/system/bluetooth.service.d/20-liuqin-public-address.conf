[Unit]
# The QCA6490 is first exposed only on the global MGMT unconfigured-index
# list; it is absent from BlueZ's normal controller list until its provisioned
# public address is committed.  Requires+After makes helper failure a hard
# startup failure instead of a parallel race.
Requires=liuqin-bt-preconfigure.service
After=liuqin-bt-preconfigure.service
StartLimitIntervalSec=300
StartLimitBurst=3
