# GTK's dmabuf texture import shows stale-cache-line corruption on this
# device's Adreno 730 (CPU-decoded images render as noise); force the
# memory-copy upload path until the kernel coherency story is fixed.
GDK_DISABLE=dmabuf
# WebKit's own content path must ALSO leave dmabuf.  Two variants exist and
# only one survives hardware: WEBKIT_DMABUF_RENDERER_FORCE_SHM=1 keeps the
# dmabuf renderer on SHM buffers and produced tiled/ghosted page corruption
# plus an epiphany SIGSEGV on 2026-08-29; WEBKIT_DISABLE_DMABUF_RENDERER=1
# drops to the legacy compositor and has passed on-device visual A/B twice.
# Both lines retire together when the kernel fix lands.
WEBKIT_DISABLE_DMABUF_RENDERER=1
