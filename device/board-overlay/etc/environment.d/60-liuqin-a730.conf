# A730 shared-memory compute corruption is avoided by disabling early preambles.
# Related upstream report: https://gitlab.freedesktop.org/mesa/mesa/-/issues/15568
# Keep Fedora Mesa packages and shader caching; isolate previously compiled CL programs.
# Retest without this workaround after Mesa updates. See docs/GPU.md.
IR3_SHADER_DEBUG=noearlypreamble
MESA_SHADER_CACHE_DIR=${XDG_CACHE_HOME:-$HOME/.cache}/liuqin-a730-noearly-v1
