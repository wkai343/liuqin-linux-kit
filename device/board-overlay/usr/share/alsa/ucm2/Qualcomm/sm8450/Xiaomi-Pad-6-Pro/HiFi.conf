# Xiaomi Pad 6 Pro protected speakers. No hardware volume mixer is exported.
# Older kernels lack the calibration lifecycle gate and remain hard-muted.
# New kernels verify this tablet's calibration at DSP startup and refuse
# Main AMP enable without calibrated Protection DSP output.
# Digital913 (+12 dB full scale) + Analog18 (+18.5 dB): A46 user A/B on the
# native root confirmed this is the expected Android-class loudness, with the
# calibrated Protection DSP still acting as the excursion limiter. The
# earlier 673 (-18 dB) incremental step measured 1/3-1/4 of Android loudness.
# With physical RX slots 0/1, swap DSP inputs on TR/BR to match stock mapping.
# The PCM carrier has four slots, but the four amps consume only slots 0/1.
#
# The verb owns both DPCM front-end/back-end routes.  PipeWire probes the verb
# by opening every PCM it lists before enabling any device, and a DPCM front
# end with no routed back end fails open with -EINVAL ("no backend DAIs enabled
# for MultiMedia2").  One failed PCM marks the whole HiFi profile unsupported
# and leaves only Dummy Output, so the capture route cannot wait for the Mic
# device's EnableSequence, which only runs after the probe succeeded.

SectionVerb {
	# PipeWire opens the PCM while probing this verb, before Speaker is
	# enabled. Prepare the protected DSP path before connecting the backend;
	# otherwise the probe powers the default ASP path and the kernel correctly
	# refuses four uncalibrated amps with -EACCES. Never relax that kernel gate.
	If.protected_playback {
		Condition {
			Type ControlExists
			Control "name='BL Speaker Calibration Loaded'"
		}
		True.EnableSequence [
			cset "name='TL Digital PCM Volume' 0"
			cset "name='TR Digital PCM Volume' 0"
			cset "name='BL Digital PCM Volume' 0"
			cset "name='BR Digital PCM Volume' 0"
			cset "name='TL Analog PCM Volume' 0"
			cset "name='TR Analog PCM Volume' 0"
			cset "name='BL Analog PCM Volume' 0"
			cset "name='BR Analog PCM Volume' 0"
			cset "name='TL DSP1 Preload Switch' 1"
			cset "name='TR DSP1 Preload Switch' 1"
			cset "name='BL DSP1 Preload Switch' 1"
			cset "name='BR DSP1 Preload Switch' 1"
			cset "name='TL DSP RX1 Source' ASPRX1"
			cset "name='TL DSP RX2 Source' ASPRX2"
			cset "name='TL PCM Soft Ramp' 4ms"
			cset "name='TL PCM Source' DSP"
			cset "name='TR DSP RX1 Source' ASPRX2"
			cset "name='TR DSP RX2 Source' ASPRX1"
			cset "name='TR PCM Soft Ramp' 4ms"
			cset "name='TR PCM Source' DSP"
			cset "name='BL DSP RX1 Source' ASPRX1"
			cset "name='BL DSP RX2 Source' ASPRX2"
			cset "name='BL PCM Soft Ramp' 4ms"
			cset "name='BL PCM Source' DSP"
			cset "name='BR DSP RX1 Source' ASPRX2"
			cset "name='BR DSP RX2 Source' ASPRX1"
			cset "name='BR PCM Soft Ramp' 4ms"
			cset "name='BR PCM Source' DSP"
			cset "name='TERTIARY_TDM_RX_0 Audio Mixer MultiMedia1' 1,0"
		]
		False.EnableSequence [
			cset "name='TERTIARY_TDM_RX_0 Audio Mixer MultiMedia1' 1,0"
		]
	}
	DisableSequence [
		cset "name='TERTIARY_TDM_RX_0 Audio Mixer MultiMedia1' 0,0"
	]
	# Guarded like the Mic device: a kernel without the capture route must
	# not take the speaker verb down with it.
	If.capture_route {
		Condition {
			Type ControlExists
			Control "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3'"
		}
		True.EnableSequence [
			cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
		]
		True.DisableSequence [
			cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
		]
	}
	# DP uses a separate stereo FE. Route it before PipeWire probes the
	# verb, and guard both the route and device for older topology/kernel pairs.
	If.dp_route {
		Condition {
			Type ControlExists
			Control "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia3'"
		}
		True.EnableSequence [
			cset "name='stream2.vol_ctrl2 MultiMedia3 Playback Volu' 8192"
			cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia3' 1"
		]
		True.DisableSequence [
			cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia3' 0"
		]
	}
	Value { TQ "HiFi" }
}

SectionDevice."Speaker" {
	Comment "Speakers"
	EnableSequence [
		cset "name='TL Digital PCM Volume' 0"
		cset "name='TR Digital PCM Volume' 0"
		cset "name='BL Digital PCM Volume' 0"
		cset "name='BR Digital PCM Volume' 0"
		cset "name='TL Analog PCM Volume' 0"
		cset "name='TR Analog PCM Volume' 0"
		cset "name='BL Analog PCM Volume' 0"
		cset "name='BR Analog PCM Volume' 0"
	]
	DisableSequence [
		cset "name='TL Digital PCM Volume' 0"
		cset "name='TR Digital PCM Volume' 0"
		cset "name='BL Digital PCM Volume' 0"
		cset "name='BR Digital PCM Volume' 0"
		cset "name='TL Analog PCM Volume' 0"
		cset "name='TR Analog PCM Volume' 0"
		cset "name='BL Analog PCM Volume' 0"
		cset "name='BR Analog PCM Volume' 0"
	]
	If.protection_owner {
		Condition {
			Type ControlExists
			Control "name='BL Speaker Calibration Loaded'"
		}
		True.EnableSequence [
			# DSP preparation belongs to the verb, before PCM probing.
			cset "name='TL Analog PCM Volume' 18"
			cset "name='TR Analog PCM Volume' 18"
			cset "name='BL Analog PCM Volume' 18"
			cset "name='BR Analog PCM Volume' 18"
			cset "name='TL Digital PCM Volume' 913"
			cset "name='TR Digital PCM Volume' 913"
			cset "name='BL Digital PCM Volume' 913"
			cset "name='BR Digital PCM Volume' 913"
		]
	}
	Value {
		PlaybackChannels 4
		PlaybackChannel0 0
		PlaybackChannelPos0 FL
		PlaybackChannel1 1
		PlaybackChannelPos1 FR
		PlaybackRate 48000
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}
# Four analog microphones in ADC1/2/3/4 order: AMIC1/3/4/5.
# The kernel DT owns bias and fixed SoundWire routing. DEC0..3 feed the
# four-channel codec-DMA backend. UCM owns ADC port switches and gains;
# do not expose ADCn as a desktop mixer: its playback switch is actually a
# SoundWire port selector. Desktop recording uses software volume/mute.
# The route guard also keeps playback-only installed topologies usable.
If.mic_pcm {
	Condition {
		Type ControlExists
		Control "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3'"
	}
	True.SectionDevice."Mic" {
		Comment "Onboard microphone array"
		EnableSequence [
			cset "name='ADC2 MUX' INP3"
			cset "name='ADC3 MUX' INP4"
			cset "name='ADC4 MUX' INP5"
			cset "name='HDR12 MUX' NO_HDR12"
			cset "name='HDR34 MUX' NO_HDR34"
			cset "name='ADC1 Volume' 8"
			cset "name='TX0 MODE' ADC_NORMAL"
			cset "name='ADC1_MIXER Switch' 1"
			cset "name='ADC1 Switch' 1"
			cset "name='TX DEC0 MUX' SWR_MIC"
			cset "name='TX SMIC MUX0' SWR_MIC4"
			cset "name='DEC0 MODE' ADC_DEFAULT"
			cset "name='TX_DEC0 Volume' 102"
			cset "name='TX_AIF1_CAP Mixer DEC0' 1"
			cset "name='ADC2 Volume' 8"
			cset "name='TX1 MODE' ADC_NORMAL"
			cset "name='ADC2_MIXER Switch' 1"
			cset "name='ADC2 Switch' 1"
			cset "name='TX DEC1 MUX' SWR_MIC"
			cset "name='TX SMIC MUX1' SWR_MIC5"
			cset "name='DEC1 MODE' ADC_DEFAULT"
			cset "name='TX_DEC1 Volume' 102"
			cset "name='TX_AIF1_CAP Mixer DEC1' 1"
			cset "name='ADC3 Volume' 8"
			cset "name='TX2 MODE' ADC_NORMAL"
			cset "name='ADC3_MIXER Switch' 1"
			cset "name='ADC3 Switch' 1"
			cset "name='TX DEC2 MUX' SWR_MIC"
			cset "name='TX SMIC MUX2' SWR_MIC8"
			cset "name='DEC2 MODE' ADC_DEFAULT"
			cset "name='TX_DEC2 Volume' 102"
			cset "name='TX_AIF1_CAP Mixer DEC2' 1"
			cset "name='ADC4 Volume' 8"
			cset "name='TX3 MODE' ADC_NORMAL"
			cset "name='ADC4_MIXER Switch' 1"
			cset "name='ADC4 Switch' 1"
			cset "name='TX DEC3 MUX' SWR_MIC"
			cset "name='TX SMIC MUX3' SWR_MIC9"
			cset "name='DEC3 MODE' ADC_DEFAULT"
			cset "name='TX_DEC3 Volume' 102"
			cset "name='TX_AIF1_CAP Mixer DEC3' 1"
		]
		DisableSequence [
			cset "name='TX_AIF1_CAP Mixer DEC3' 0"
			cset "name='TX SMIC MUX3' ZERO"
			cset "name='ADC4_MIXER Switch' 0"
			cset "name='ADC4 Switch' 0"
			cset "name='TX3 MODE' ADC_INVALID"
			cset "name='TX_AIF1_CAP Mixer DEC2' 0"
			cset "name='TX SMIC MUX2' ZERO"
			cset "name='ADC3_MIXER Switch' 0"
			cset "name='ADC3 Switch' 0"
			cset "name='TX2 MODE' ADC_INVALID"
			cset "name='TX_AIF1_CAP Mixer DEC1' 0"
			cset "name='TX SMIC MUX1' ZERO"
			cset "name='ADC2_MIXER Switch' 0"
			cset "name='ADC2 Switch' 0"
			cset "name='TX1 MODE' ADC_INVALID"
			cset "name='TX_AIF1_CAP Mixer DEC0' 0"
			cset "name='TX SMIC MUX0' ZERO"
			cset "name='ADC1_MIXER Switch' 0"
			cset "name='ADC1 Switch' 0"
			cset "name='TX0 MODE' ADC_INVALID"
		]
		Value {
			CapturePriority 100
			CapturePCM "hw:${CardId},1"
			CaptureChannels 4
			CaptureRate 48000
		}
	}
}

# The DP jack is registered by the sound card, independently of the codec's
# DisplayPort0 control prefix. It tracks the physical sink connection.
If.dp_pcm {
	Condition {
		Type ControlExists
		Control "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia3'"
	}
	True.SectionDevice."HDMI" {
		Comment "DisplayPort"
		Value {
			PlaybackPCM "hw:${CardId},2"
			PlaybackChannels 2
			PlaybackRate 48000
			PlaybackPriority 200
			JackControl "DP0 Jack"
		}
	}
}
