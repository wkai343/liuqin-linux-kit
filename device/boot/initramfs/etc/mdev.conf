# Keep the standard character devices usable by unprivileged stage-2 services.
# BusyBox mdev otherwise changes existing devtmpfs nodes to its 0660 default;
# systemd may start D-Bus before udev coldplug has changed them back to 0666.
null 0:0 666
zero 0:0 666
full 0:0 666
random 0:0 666
urandom 0:0 666
tty 0:0 666
ptmx 0:0 666
console 0:0 600
fuse 0:0 666
