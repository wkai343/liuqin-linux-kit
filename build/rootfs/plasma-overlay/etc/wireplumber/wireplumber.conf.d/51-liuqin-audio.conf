# 内置扬声器使用 HiFi 的 UCM 路由和保护初始化。
# 通用 Pro Audio 不执行这些步骤，不向这张声卡提供此选项。
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.platform-sound"
        api.alsa.card.longname = "Xiaomi-Pad-6-Pro"
      }
    ]
    actions = {
      update-props = {
        api.acp.disable-pro-audio = true
      }
    }
  }
]
