[Unit]
# Ordering alone does not start the greeter compositor in desktop sessions.
# Stop the greeter's power manager before its Wayland socket disappears.
After=plasma-login-kwin_wayland.service
PartOf=plasma-login-wayland.target plasma-login-kwin_wayland.service

[Service]
ExecCondition=/usr/libexec/liuqin-plasma-power-ready
