# Keep the monitor, devices and sources on one libcamera CameraManager.
context.spa-libs = {
  api.libcamera.* = libcamera/libspa-liuqin-libcamera
}

monitor.libcamera.rules = [
  {
    matches = [
      {
        factory.name = api.libcamera.source
        api.libcamera.path = "/base/soc@0/cci@ac15000/i2c-bus@0/camera@10"
        api.libcamera.location = front
      }
    ]
    actions = {
      update-props = { api.libcamera.preferred-size = "2592x1952" }
    }
  }
  {
    matches = [
      {
        factory.name = api.libcamera.source
        api.libcamera.path = "/base/soc@0/cci@ac15000/i2c-bus@1/camera@10"
        api.libcamera.location = back
      }
    ]
    actions = {
      update-props = { api.libcamera.preferred-size = "4080x3060" }
    }
  }
]
